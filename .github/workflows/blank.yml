# This is a basic workflow to help you get started with Actions

name: Actividad GitHub Actions

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    env: 
      plataforma: aws 
      region: america
      cuenta: desarrollador
      USER_NAME: ${{ secrets.NOMBRE_USUARIO }}
      USER_PASS: ${{ secrets.password}}

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      - name: Mostrar mensaje 
        run: echo "Hola Mundo"
      # Runs a single command using the runners shell
      - name: Probando las variables de entorno
        run: |
          echo "Plataforma de despliegue: ${{ env.plataforma }}"
          echo "Región asignada: ${{ env.region }}"
          echo "Entorno de cuenta: ${{ env.cuenta }}"


      - name: Debug del payload completo 
        run: echo "${{ toJSON(github.event) }}"

      - name: Mostrar metadatos Básicos 
        run: | 
          echo "Usuario ejecutor: ${{ github.actor }}"
          echo "Repositorio activo: ${{ github.repository }}"
      
      - name: Validación de Credenciales
        if: env.USER_NAME != '' && env.USER_PASS != ''
        run: | 
          echo  "Estado: Credenciales de autenticación detectadas. Procediendo..."
  
      - name: Referencia a Variable Global
        run: | 
          echo "Versión del proyecto: ${{ vars.PROJECT_VERSION }}"

      # Runs a set of commands using the runners shell
      - name: Run a multi-line script
        run: |
          echo Add other actions to build,
          echo test, and deploy your project.
